name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./eco-manage
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: ./eco-manage
        run: npx vite build

      - name: Prepare deployment package
        working-directory: ./eco-manage
        run: |
          tar -czf ../deploy.tar.gz \
            dist/ \
            server.js \
            package.json \
            package-lock.json \
            electron/database/apiHandlers.js \
            electron/database/db.js \
            electron/database/schema.sql \
            electron/database/session.js \
            electron/main.js \
            electron/preload.js \
            electron/api-server.js

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: SCP deploy package to VPS
        run: |
          for i in 1 2 3; do
            echo "SCP attempt $i/3..."
            scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=10 \
              deploy.tar.gz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/saas/" \
              && echo "SCP OK" && break
            echo "Attempt $i failed. Waiting 15s..."
            sleep 15
            if [ $i -eq 3 ]; then echo "All SCP attempts failed." && exit 1; fi
          done

      - name: Extract and restart on VPS
        run: |
          for i in 1 2 3; do
            echo "SSH attempt $i/3..."
            ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=10 \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
                set -e
                cd /var/www/saas
                mkdir -p /var/opt/eco-hub-data/backups
                cp /var/opt/eco-hub-data/school.db /var/opt/eco-hub-data/backups/school_pre_deploy_$(date +%Y%m%d_%H%M).db 2>/dev/null || true
                rm -rf dist/
                tar -xzf deploy.tar.gz
                rm deploy.tar.gz
                npm install --legacy-peer-deps --production
                pm2 restart eco-hub-saas
                sleep 5
                curl -sf http://localhost:8080/api/health || (echo "HEALTH CHECK FAILED" && pm2 logs eco-hub-saas --lines 20 && exit 1)
                echo "DEPLOY SUCCESS"
              ' && echo "SSH OK" && break
            echo "Attempt $i failed. Waiting 15s..."
            sleep 15
            if [ $i -eq 3 ]; then echo "All SSH attempts failed." && exit 1; fi
          done

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
