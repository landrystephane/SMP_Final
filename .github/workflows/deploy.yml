name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Fix workspace permissions
        run: sudo /usr/local/bin/fix-saas-ownership

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./eco-manage
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: ./eco-manage
        run: npx vite build

      - name: Deploy files
        run: |
          set -e

          # Garantir que le user deploy possède tout (au cas où root aurait touché des fichiers)
          sudo /usr/local/bin/fix-saas-ownership

          # Backup database
          mkdir -p /var/opt/eco-hub-data/backups
          cp /var/opt/eco-hub-data/school.db \
            /var/opt/eco-hub-data/backups/school_pre_deploy_$(date +%Y%m%d_%H%M).db 2>/dev/null || true

          # Copy built assets and server files
          rm -rf /var/www/saas/dist /var/www/saas/electron
          cp -r eco-manage/dist            /var/www/saas/dist
          cp    eco-manage/server.js       /var/www/saas/server.js
          cp    eco-manage/package.json    /var/www/saas/package.json
          cp    eco-manage/package-lock.json /var/www/saas/package-lock.json
          cp -r eco-manage/electron        /var/www/saas/electron

          # Install production dependencies
          cd /var/www/saas
          npm install --legacy-peer-deps --production

          # Nginx: augmenter la taille max des requêtes pour les images base64 (logos, filigranes)
          NGINX_CONF=$(sudo nginx -T 2>/dev/null | grep -l 'ecomanageapp' /etc/nginx/sites-enabled/* 2>/dev/null | head -1 || echo "")
          if [ -z "$NGINX_CONF" ]; then
            NGINX_CONF=$(ls /etc/nginx/sites-enabled/ 2>/dev/null | head -1)
            NGINX_CONF="/etc/nginx/sites-enabled/$NGINX_CONF"
          fi
          if [ -f "$NGINX_CONF" ] && ! grep -q 'client_max_body_size' "$NGINX_CONF"; then
            sudo sed -i '/server {/a\    client_max_body_size 20m;' "$NGINX_CONF"
            sudo nginx -t && sudo systemctl reload nginx && echo "Nginx: client_max_body_size 20m ajouté"
          else
            echo "Nginx: client_max_body_size déjà configuré ou fichier introuvable"
          fi

          # Restart app and verify
          sudo pm2 restart eco-hub-saas
          sleep 5
          curl -sf http://localhost:8080/api/health \
            || (echo "HEALTH CHECK FAILED" && sudo pm2 logs eco-hub-saas --lines 20 && exit 1)

          echo "DEPLOY SUCCESS"
