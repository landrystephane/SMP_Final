name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./eco-manage
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: ./eco-manage
        run: npx vite build

      - name: Prepare deployment package
        working-directory: ./eco-manage
        run: |
          tar -czf ../deploy.tar.gz \
            dist/ \
            server.js \
            package.json \
            package-lock.json \
            electron/database/apiHandlers.js \
            electron/database/db.js \
            electron/database/schema.sql \
            electron/database/session.js \
            electron/main.js \
            electron/preload.js \
            electron/api-server.js

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/var/www/saas/"

      - name: Extract and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/saas
            cp /var/opt/eco-hub-data/school.db /var/opt/eco-hub-data/backups/school_pre_deploy_$(date +%Y%m%d_%H%M).db
            rm -rf dist/
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            npm install --legacy-peer-deps --production
            pm2 restart eco-hub-saas
            sleep 3
            curl -sf http://localhost:8080/api/health || (echo "DEPLOY FAILED" && pm2 logs eco-hub-saas --lines 5 && exit 1)
            echo "DEPLOY SUCCESS"
