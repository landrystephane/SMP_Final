name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./eco-manage
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: ./eco-manage
        run: npx vite build

      - name: Deploy files
        run: |
          set -e

          # Fix ownership in case root created files during a previous manual fix
          sudo chown -R deploy:deploy /var/www/saas 2>/dev/null || true
          sudo rm -rf /var/www/saas/dist /var/www/saas/electron 2>/dev/null || rm -rf /var/www/saas/dist /var/www/saas/electron

          # Backup database
          mkdir -p /var/opt/eco-hub-data/backups
          cp /var/opt/eco-hub-data/school.db \
            /var/opt/eco-hub-data/backups/school_pre_deploy_$(date +%Y%m%d_%H%M).db 2>/dev/null || true

          # Copy built assets and server files
          cp -r eco-manage/dist            /var/www/saas/dist
          cp    eco-manage/server.js       /var/www/saas/server.js
          cp    eco-manage/package.json    /var/www/saas/package.json
          cp    eco-manage/package-lock.json /var/www/saas/package-lock.json
          cp -r eco-manage/electron        /var/www/saas/electron

          # Install production dependencies
          cd /var/www/saas
          npm install --legacy-peer-deps --production

          # Restart app and verify
          sudo pm2 restart eco-hub-saas
          sleep 5
          curl -sf http://localhost:8080/api/health \
            || (echo "HEALTH CHECK FAILED" && sudo pm2 logs eco-hub-saas --lines 20 && exit 1)

          echo "DEPLOY SUCCESS"
